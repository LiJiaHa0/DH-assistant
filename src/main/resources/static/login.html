<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - DH Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #F0F5FF 0%, #EAF7FF 100%);
        }

        .login-container {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 40px rgba(74, 134, 232, 0.12);
            padding: 48px 40px;
            width: 100%;
            max-width: 400px;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: #4A86E8;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 16px;
            box-shadow: 0 4px 16px rgba(74, 134, 232, 0.3);
        }

        .login-container h1 {
            text-align: center;
            color: #1a1a1a;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .login-container .subtitle {
            text-align: center;
            color: #aaa;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #555;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper .input-icon {
            position: absolute;
            left: 14px;
            color: #999;
            display: flex;
            align-items: center;
            pointer-events: none;
        }

        .input-wrapper .toggle-password {
            position: absolute;
            right: 14px;
            color: #999;
            cursor: pointer;
            display: flex;
            align-items: center;
            user-select: none;
        }

        .input-wrapper .toggle-password:hover {
            color: #666;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            background: #E6EEFF;
            border: 2px solid transparent;
            border-radius: 10px;
            font-size: 15px;
            transition: border-color 0.3s, background 0.3s;
            outline: none;
            color: #333;
        }

        .form-group input:focus {
            border-color: #4A86E8;
            background: #fff;
        }

        .form-group input::placeholder {
            color: #b0b8c5;
        }

        .form-group:last-of-type {
            margin-bottom: 28px;
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            background: #4A86E8;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.2s;
            letter-spacing: 2px;
            box-shadow: 0 4px 12px rgba(74, 134, 232, 0.25);
        }

        .btn-login:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .divider {
            text-align: center;
            margin: 28px 0;
            position: relative;
            color: #bbb;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: #e8e8e8;
        }

        .divider::before { left: 0; }
        .divider::after { right: 0; }

        .btn-register {
            width: 100%;
            padding: 13px;
            background: transparent;
            color: #4A86E8;
            border: 2px solid #4A86E8;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, color 0.3s, transform 0.2s;
            letter-spacing: 2px;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .btn-register:hover {
            background: #4A86E8;
            color: #fff;
            transform: translateY(-1px);
        }

        .btn-register:active {
            transform: translateY(0);
        }

        .message {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: #e74c3c;
            min-height: 20px;
        }

        .message.success {
            color: #27ae60;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-area">
            <div class="logo-icon">🤖</div>
            <h1>DH智能助手</h1>
            <p class="subtitle">DH Assistant · 登录</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="phone">手机号</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </span>
                    <input type="tel" id="phone" name="phone" placeholder="请输入手机号" required autocomplete="tel" maxlength="11">
                </div>
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                    <input type="password" id="password" name="password" placeholder="请输入密码" required autocomplete="current-password">
                    <span class="toggle-password" id="togglePassword">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </span>
                </div>
            </div>

            <button type="submit" class="btn-login">登 录</button>
        </form>

        <p class="message" id="message"></p>

        <div class="divider">还没有账号？</div>

        <a href="register.html" class="btn-register">立即注册</a>
    </div>

    <script>
        // 密码明文/密文切换
        document.getElementById('togglePassword').addEventListener('click', function() {
            const pwd = document.getElementById('password');
            pwd.type = pwd.type === 'password' ? 'text' : 'password';
        });

        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value.trim();
            const msgEl = document.getElementById('message');

            if (!phone || !password) {
                msgEl.className = 'message';
                msgEl.textContent = '请填写手机号和密码';
                return;
            }

            // 校验手机号格式
            if (!/^1[3-9]\d{9}$/.test(phone)) {
                msgEl.className = 'message';
                msgEl.textContent = '手机号格式不正确';
                return;
            }

            fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.code === 200) {
                    msgEl.className = 'message success';
                    msgEl.textContent = data.msg || '登录成功，正在跳转...';
                    setTimeout(() => {
                        window.location.href = '/index.html';
                    }, 800);
                } else {
                    msgEl.className = 'message';
                    msgEl.textContent = data.msg || '登录失败';
                }
            })
            .catch(() => {
                msgEl.className = 'message';
                msgEl.textContent = '网络错误，请稍后重试';
            });
        });
    </script>
</body>
</html>
